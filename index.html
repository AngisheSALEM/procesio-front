<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo-dgda.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procezo — DGDA | Gestion du Renseignement et Dossiers d’Enquête</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('procezo_theme');
          if (savedTheme === 'light' || savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', savedTheme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
